name: Автопостинг

on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

concurrency:
  group: autopost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Найти папку бота
        run: |
          BOT=$(find . -name bot.py -not -path "./.git/*" | head -n 1)
          if [ -z "$BOT" ]; then echo "Не найден bot.py в репозитории"; exit 1; fi
          echo "BOT_DIR=$(dirname "$BOT")" >> "$GITHUB_ENV"
          echo "Папка бота: $(dirname "$BOT")"

      - name: Установить библиотеки
        run: pip install -r "$BOT_DIR/requirements.txt"

      - name: Опубликовать посты
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          cd "$BOT_DIR"
          python bot.py --once --ahead 20

      - name: Запомнить, что уже выложено
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Отметка опубликованных постов"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          echo "Не удалось сохранить sent.json"
          exit 1
